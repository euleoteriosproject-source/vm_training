project_id = "vm-training"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://vm-training.vercel.app"
additional_redirect_urls = [
  "https://vm-training.vercel.app/auth/callback",
  "https://vm-training.vercel.app/update-password",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/update-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/update-password",
  "http://192.168.2.109:3000/auth/callback",
  "http://192.168.2.109:3000/update-password"
]
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_signup"

[storage]
enabled = true
file_size_limit = "50MiB"
